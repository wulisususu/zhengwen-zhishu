server:
  host: 0.0.0.0
  port: 8000
  debug: false
database:
  url: sqlite:///data/app.db
jwt:
  secret: ""
  algorithm: HS256
  expire_minutes: 1440
logging:
  level: INFO
  file: data/app.log

# ── 模型出口策略（必须显式指定；不配置时按 intranet 处理，不会调用云端）──
model:
  # cloud_allowed : 允许调用显式配置的云端模型。⚠️ 请求内容会离开本机 / 当前网络边界
  # intranet      : 只允许 loopback 与私有网段地址（内网模型服务），公网地址直接拒绝
  # offline       : 只允许本机 loopback；无法完成时明确报错，不会静默改用云端
  # 注意：这里只是应用层开关，不能证明设备没有外网流量；真正的断网需在
  #      操作系统层（iptables/nftables/防火墙）限制。可用环境变量 AI_BOX_MODEL_MODE 覆盖。
  mode: cloud_allowed

# ── 管理员引导：首次启动时若没有任何 admin，则把该用户名提升为管理员 ──
# 留空则取 id 最小的用户（通常是初始化时创建的第一个账号）
security:
  admin_username: ""

llm:
  cloud_api_key: ""
internal:
  service_token: ""
openclaw:
  gateway_token: ""
