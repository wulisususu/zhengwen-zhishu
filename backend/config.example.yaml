server:
  host: 0.0.0.0
  port: 8000
  debug: false
database:
  url: sqlite:///data/app.db
jwt:
  secret: ""
  algorithm: HS256
  expire_minutes: 1440
logging:
  level: INFO
  file: data/app.log

# ── 模型出口策略（必须显式指定；不配置时按 intranet 处理，不会调用云端）──
model:
  # cloud_allowed : 允许调用显式配置的云端模型。⚠️ 请求内容会离开本机 / 当前网络边界
  # intranet      : 只允许 loopback 与私有网段地址（内网模型服务），公网地址直接拒绝
  # offline       : 只允许本机 loopback；无法完成时明确报错，不会静默改用云端
  # 注意：这里只是应用层开关，不能证明设备没有外网流量；真正的断网需在
  #      操作系统层（iptables/nftables/防火墙）限制。可用环境变量 AI_BOX_MODEL_MODE 覆盖。
  mode: cloud_allowed

# ── 管理员引导：首次启动时若没有任何 admin，则把该用户名提升为管理员 ──
# 留空则取 id 最小的用户（通常是初始化时创建的第一个账号）
security:
  admin_username: ""

# ── 政策检索（T1）。以下均为可调参数，按部署环境修改 ──
# 只有 model.mode = cloud_allowed 时才会访问外部数据源；intranet / offline 下只查本地库（source=local_only）
policy:
  enabled: true                       # false = 只查本地库，不联网
  base_url: https://sousuo.www.gov.cn/search-gov/data   # 国务院政策文件库检索接口；留空 = 不联网
  timeout_seconds: 15                 # 单次请求超时（秒）
  retry: 2                            # 仅超时 / 5xx 时重试，最多 2 次
  min_interval_seconds: 1.0           # 两次请求最小间隔（秒），不得小于 1
  cache_ttl_seconds: 300              # 同一检索 5 分钟内走内存缓存
  max_pages: 20                       # 同步翻页上限（硬上限 20）
  db_path: data/policy.db             # 公开政策库 SQLite（与用户私有知识库分库存放）
  fetch:                              # 导入原文 URL 时的抓取限制（SSRF 防护）
    allowed_hosts: [sousuo.www.gov.cn, www.gov.cn]
    extra_allowed_hosts: []           # 部门站点必须在此显式加入，例如 [www.miit.gov.cn]
    timeout_seconds: 15               # 上限 15
    max_bytes: 10485760               # 响应体上限 10 MB
    max_redirects: 2                  # 重定向上限 2 跳，每跳重新校验域名与 IP

llm:
  cloud_api_key: ""
internal:
  service_token: ""
openclaw:
  gateway_token: ""

# ── 公文生成与审校（gongwen-kit，Node >= 18）。安装见 backend/third_party/README.md ──
gongwen:
  kit_path: third_party/gongwen-kit   # 相对 backend/ 或绝对路径；离线包解压后指向解压目录
  node_bin: node                       # Node 可执行文件，不在 PATH 时写绝对路径
  check_timeout_seconds: 20            # x86 实测单份 0.5 s；板端未测，留足余量
  render_timeout_seconds: 30           # 生成（含 gongwen-kit 自带的出稿自检）x86 实测约 1 s
  fix_timeout_seconds: 30
  max_upload_mb: 10                    # 上传 .docx 大小上限
  max_concurrent: 2                    # 同时运行的 Node 进程上限

# 政策PDF匯入的獨立開關。先完成目標設備驗證，再設 opendataloader。
# 不改一般文件解析及原有OCR鏈路；掃描/混合頁或失敗會回退原鏈路。
policy_pdf:
  engine: legacy
  jar_path: ""                        # opendataloader-pdf 2.5.15 隨包CLI jar絕對路徑
  java_bin: java
  timeout_seconds: 60                 # JVM固定-Xmx512m，最多一個；超時回退OCR
